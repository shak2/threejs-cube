<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Three.js Cube</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <!-- Include Three.js v79 -->
    <script src="https://unpkg.com/three-js@79.0.0/three.js"></script>

    <script>
        // 1. Create the Scene
        var scene = new THREE.Scene();

        // 2. Create the Camera (Field of view, Aspect ratio, Near clipping, Far clipping)
        var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // 3. Create the Renderer
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Create the Cube Geometry and Material
        var geometry = new THREE.BoxGeometry(1, 1, 1);
        var material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        var cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the cube on every frame
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Render the scene
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
